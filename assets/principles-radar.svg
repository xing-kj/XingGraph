<line x1="380" y1="300" x2="380" y2="110"/>
<line x1="380" y1="300" x2="528" y2="181"/>
<line x1="380" y1="300" x2="565" y2="342"/>
<line x1="380" y1="300" x2="462" y2="471"/>
<line x1="380" y1="300" x2="298" y2="471"/>
<line x1="380" y1="300" x2="195" y2="342"/>
<line x1="380" y1="300" x2="231" y2="181"/>
</g>

<polygon points="380,129 517,191 543,337 450,445 310,445 232,334 246,193"
 fill="url(#capfill)" stroke="#a974ff" stroke-width="2.2" stroke-linejoin="round"/>

<g fill="#d9bcff">
<circle cx="380" cy="129" r="5" filter="url(#glow)"/>
<circle cx="517" cy="191" r="5" filter="url(#glow)"/>
<circle cx="543" cy="337" r="5" filter="url(#glow)"/>
<circle cx="450" cy="445" r="5" filter="url(#glow)"/>
<circle cx="310" cy="445" r="5" filter="url(#glow)"/>
<circle cx="232" cy="334" r="5" filter="url(#glow)"/>
<circle cx="246" cy="193" r="5" filter="url(#glow)"/>
</g>

<g font-size="14" font-weight="700" fill="#f3f0fa" text-anchor="middle">
<text x="380" y="64">可观测</text>
<text x="556" y="173">可回溯</text>
<text x="608" y="330">可控制</text>
<text x="474" y="505">可扩展</text>
<text x="286" y="505">可进化</text>
<text x="152" y="330">省token</text>
<text x="203" y="173">少幻觉</text>
</g>

