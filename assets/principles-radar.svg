<svg viewBox="0 0 760 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title>XingGraph 七项能力雷达</title>
<desc>Seven capability radar: observable, traceable, controllable, extensible, evolvable, token-efficient, low-hallucination.</desc>
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="capfill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#b98cff" stop-opacity="0.42"/>
<stop offset="100%" stop-color="#6b4fb0" stop-opacity="0.14"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="760" height="580" fill="#0a0a0d"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#f3f0fa">Design Principles · 七项设计能力</text>
<rect x="42" y="52" width="46" height="3" rx="1.5" fill="#a974ff"/>

<g stroke="#2a2340" stroke-width="1">
<polygon points="380,163 498,225 535,330 454,425 306,425 225,330 262,225" fill="none"/>
