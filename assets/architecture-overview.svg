<svg viewBox="0 0 1180 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title>XingGraph 架构总览</title>
<desc>Left: ingestion pipeline. Center: knowledge graph. Right: WIKI progressive retrieval. Top: seven capability bar.</desc>
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="0" y="0" width="1180" height="780" fill="#0a0a0d"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#f3f0fa">XingGraph Architecture · 架构总览</text>
<rect x="42" y="50" width="46" height="3" rx="1.5" fill="#a974ff"/>

<g font-size="11.5">
<rect x="40" y="76" width="350" height="30" rx="15" fill="#131024" stroke="#3f3560" stroke-width="1"/>
<text x="215" y="96" text-anchor="middle" fill="#f3f0fa" font-weight="700">七项能力 · Seven Capabilities</text>
<g text-anchor="middle" font-size="11">
<text x="90" y="130" fill="#b98cff">可观测</text><text x="175" y="130" fill="#b98cff">可回溯</text><text x="265" y="130" fill="#b98cff">可控制</text><text x="355" y="130" fill="#b98cff">可扩展</text>
<text x="445" y="130" fill="#b98cff">可进化</text><text x="535" y="130" fill="#b98cff">省token</text><text x="625" y="130" fill="#b98cff">少幻觉</text>
</g>
<line x1="60" y1="140" x2="900" y2="140" stroke="#2a2340" stroke-width="1"/>
</g>

<text x="40" y="178" font-size="13" font-weight="700" fill="#f3f0fa">① 建图 / Ingest</text>
<g font-size="12" text-anchor="middle">
<rect x="40" y="192" width="120" height="34" rx="8" fill="#1a1530" stroke="#6b4fb0" stroke-width="1"/>
<text x="100" y="213" fill="#e6ddf9">PDF / 文档</text>

<rect x="180" y="192" width="140" height="34" rx="8" fill="#1a1530" stroke="#6b4fb0" stroke-width="1"/>
<text x="250" y="213" fill="#e6ddf9">结构化解析 wrapper</text>

<rect x="340" y="192" width="150" height="34" rx="8" fill="#2a1a55" stroke="#8b6bff" stroke-width="1"/>
<text x="415" y="213" fill="#f3f0fa">cognify --chunker</text>

<rect x="510" y="192" width="130" height="34" rx="8" fill="#1a1530" stroke="#6b4fb0" stroke-width="1"/>
<text x="575" y="213" fill="#e6ddf9">StructuredDoc</text>
</g>
<g stroke="#4a3d78" stroke-width="1.5">
<line x1="162" y1="209" x2="178" y2="209"/><polygon points="178,206 182,209 178,212" fill="#4a3d78"/>
<line x1="322" y1="209" x2="338" y2="209"/><polygon points="338,206 342,209 338,212" fill="#4a3d78"/>
<line x1="492" y1="209" x2="508" y2="209"/><polygon points="508,206 512,209 508,212" fill="#4a3d78"/>
</g>

<g font-size="11" text-anchor="middle" fill="#8a82a0">
<text x="250" y="246">逐块入库 · 标题层级写 metadata</text>
<text x="415" y="246">chunker 注册表可自定义</text>
</g>

<text x="40" y="286" font-size="13" font-weight="700" fill="#f3f0fa">② 知识图谱 / Knowledge Graph</text>
<g>
<circle cx="180" cy="352" r="26" fill="#3a2566" filter="url(#glow)"/>
<text x="180" y="347" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Entity</text>
<text x="180" y="361" font-size="9" fill="#cdbcf2" text-anchor="middle">实体锚定</text>
<circle cx="300" cy="352" r="26" fill="#2a1a55" stroke="#8b6bff" stroke-width="1"/>
<text x="300" y="347" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Chunk</text>
<text x="300" y="361" font-size="9" fill="#cdbcf2" text-anchor="middle">原文切片</text>
<circle cx="420" cy="352" r="26" fill="#3a2566" filter="url(#glow)"/>
<text x="420" y="347" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Wiki</text>
<text x="420" y="361" font-size="9" fill="#cdbcf2" text-anchor="middle">章节摘要</text>
<g stroke="#4a3d78" stroke-width="1.5">
<line x1="206" y1="352" x2="272" y2="352"/><polygon points="272,349 280,352 272,355" fill="#4a3d78"/>
<line x1="326" y1="352" x2="392" y2="352"/><polygon points="392,349 400,352 392,355" fill="#4a3d78"/>
</g>
<g font-size="10" fill="#8a82a0" text-anchor="middle">
<text x="240" y="344">contains</text>
<text x="364" y="344">summarizes</text>
</g>
<g font-size="10" fill="#7d7590" text-anchor="middle">
<text x="180" y="398">本体: RDF/OWL</text>
<text x="300" y="398">标题归因元数据</text>
<text x="420" y="398">model_hop 定向边</text>
</g>
</g>

<g stroke="#2a2340" stroke-width="1">
<line x1="90" y1="300" x2="520" y2="430" stroke-dasharray="4 3"/>
<line x1="510" y1="300" x2="90" y2="430" stroke-dasharray="4 3"/>
<line x1="300" y1="290" x2="300" y2="440" stroke-dasharray="4 3"/>
</g>

<text x="40" y="492" font-size="13" font-weight="700" fill="#f3f0fa">③ WIKI 渐进式检索 / Progressive Retrieval</text>
<g font-size="11.5" text-anchor="middle">
<rect x="40" y="508" width="120" height="40" rx="10" fill="#1a1530" stroke="#6b4fb0" stroke-width="1"/>
<text x="100" y="524" fill="#e6ddf9" font-weight="700">Step 0</text>
<text x="100" y="539" fill="#a89cc0">LLM 抽取主体+属性</text>

<rect x="180" y="508" width="120" height="40" rx="10" fill="#2a1a55" stroke="#8b6bff" stroke-width="1"/>
<text x="240" y="524" fill="#ffffff" font-weight="700">Step 1</text>
<text x="240" y="539" fill="#cdbcf2">实体锚定 · 永不过滤</text>

<rect x="320" y="508" width="120" height="40" rx="10" fill="#1a1530" stroke="#6b4fb0" stroke-width="1"/>
<text x="380" y="524" fill="#e6ddf9" font-weight="700">Step 2</text>
<text x="380" y="539" fill="#a89cc0">图遍历 Entity→Chunk→Wiki</text>

<rect x="460" y="508" width="120" height="40" rx="10" fill="#1a1530" stroke="#6b4fb0" stroke-width="1"/>
<text x="520" y="524" fill="#e6ddf9" font-weight="700">Step 3</text>
<text x="520" y="539" fill="#a89cc0">Wiki 向量扩展(可选)</text>

<rect x="600" y="508" width="120" height="40" rx="10" fill="#233a2a" stroke="#4fb080" stroke-width="1"/>
<text x="660" y="524" fill="#ffffff" font-weight="700">Step 4</text>
<text x="660" y="539" fill="#a9d8c0">LLM Wiki 筛选</text>

<rect x="740" y="508" width="140" height="40" rx="10" fill="#3a2a18" stroke="#d09a4f" stroke-width="1"/>
<text x="810" y="524" fill="#ffffff" font-weight="700">Step 5</text>
<text x="810" y="539" fill="#e0c89a">回答 + 标题归因引用</text>
</g>
<g stroke="#4a3d78" stroke-width="1.5">
<line x1="162" y1="528" x2="178" y2="528"/><polygon points="178,525 182,528 178,531" fill="#4a3d78"/>
<line x1="302" y1="528" x2="318" y2="528"/><polygon points="318,525 322,528 318,531" fill="#4a3d78"/>
<line x1="442" y1="528" x2="458" y2="528"/><polygon points="458,525 462,528 458,531" fill="#4a3d78"/>
<line x1="582" y1="528" x2="598" y2="528"/><polygon points="598,525 602,528 598,531" fill="#4a3d78"/>
<line x1="722" y1="528" x2="738" y2="528"/><polygon points="738,525 742,528 738,531" fill="#4a3d78"/>
</g>

<g font-size="10.5" fill="#8a82a0" text-anchor="middle">
<text x="100" y="566">多主体 top_k 8→15+</text>
<text x="240" y="566">subject 文档白名单</text>
<text x="380" y="566">越界 chunk 硬过滤</text>
<text x="520" y="566">省 token · 渐进加深</text>
<text x="660" y="566">够答才留 · 少幻觉</text>
<text x="810" y="566">可回溯 · 证据链</text>
</g>

<g>
<rect x="40" y="600" width="340" height="140" rx="12" fill="#131024" stroke="#3f3560" stroke-width="1"/>
<text x="58" y="624" font-size="12.5" font-weight="700" fill="#f3f0fa">可观测 / Observability</text>
<text x="58" y="648" font-size="11" fill="#a89cc0">每步检索写入结构化 trace（JSONL 落盘 + API 回传）</text>
<text x="58" y="672" font-size="11" fill="#a89cc0">OTEL trace context · usage_logger 用量可审计</text>
<text x="58" y="712" font-size="11" fill="#c4a6ff">→ 用户可实时盯住每一步跳转路径</text>

<rect x="400" y="600" width="340" height="140" rx="12" fill="#131024" stroke="#3f3560" stroke-width="1"/>
<text x="418" y="624" font-size="12.5" font-weight="700" fill="#f3f0fa">可控制 + 可进化 / Control & Evolve</text>
<text x="418" y="648" font-size="11" fill="#a89cc0">search_type / scope / node_name 全量接管</text>
<text x="418" y="672" font-size="11" fill="#a89cc0">system_prompt / chunker 注册表可自定义</text>
<text x="418" y="712" font-size="11" fill="#c4a6ff">→ feedback 影响检索权重 · 会话缓存复用</text>

<rect x="760" y="600" width="380" height="140" rx="12" fill="#131024" stroke="#3f3560" stroke-width="1"/>
<text x="778" y="624" font-size="12.5" font-weight="700" fill="#f3f0fa">省 token + 少幻觉 / Efficient & Reliable</text>
<text x="778" y="648" font-size="11" fill="#a89cc0">subject 文档白名单硬过滤，他文不进上下文</text>
<text x="778" y="672" font-size="11" fill="#a89cc0">回答绑定原文 chunk + 标题归因引用，杜绝乱生成</text>
<text x="778" y="712" font-size="11" fill="#c4a6ff">→ include_references 随答案回传参考原文片段</text>
</g>
</svg>
