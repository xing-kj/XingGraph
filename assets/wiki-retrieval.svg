<title>XingGraph 检索展示</title>
<desc>Query splits into subjects A and B, chunks are screened (relevant ones linked, irrelevant crossed out), wikis merge into a summary box, and if the summary is insufficient the light falls back to the original chunk before generating the final answer.</desc>
<defs>
