<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title id="title">纯图谱路线为什么不行：边越建越多 · 因果越建越片面 · 检索回不了原文</title>
<desc id="desc">以 DW-1224DC 为中心的纯三元组图谱：属性与关系全部建成边，图越来越复杂；复杂因果链被压成片面边丢失细节；检索时只点亮属性边，回不了原文，产生幻觉。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0a12"/>
<stop offset="0.5" stop-color="#151026"/>
<stop offset="1" stop-color="#0a0a12"/>
</linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#a974ff" stop-opacity="0.35"/>
<stop offset="1" stop-color="#a974ff" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="0" y="0" width="1200" height="1000" fill="url(#bg)"/>
<text x="40" y="44" font-size="24" font-weight="700" fill="#f3f0fa">纯图谱路线：边越建越多 · 因果越建越片面 · 检索回不了原文</text>
<rect x="42" y="56" width="640" height="3" rx="1.5" fill="#a974ff"/>

<!-- ============ ① 图谱区 ============ -->
<g id="zone-graph" transform="translate(0 78)">
  <rect x="20" y="0" width="1160" height="440" rx="16" fill="#0d0b18" opacity="0.55" stroke="#1f1838" stroke-width="1"/>
  <text x="40" y="26" font-size="15" font-weight="600" fill="#a974ff">① LLM 把属性与关系全建成边</text>

  <!-- 幽灵背景边（外围环，不穿中心，低透明度） -->
  <g stroke="#2a2240" stroke-width="1" fill="none" opacity="0.3">
    <path d="M 170 75 L 735 62"/>
    <path d="M 735 62 L 990 240"/>
    <path d="M 250 125 L 170 75"/>
    <path d="M 250 125 L 330 430"/>
    <path d="M 330 430 L 700 440"/>
    <path d="M 990 240 L 1010 129"/>
  </g>

  <!-- 幽灵小节点（外围复杂度纹理） -->
  <g>
    <circle cx="170" cy="75" r="13" fill="#1a1030" stroke="#3a2d5c" stroke-width="1"/>
    <text x="170" y="104" font-size="10" fill="#6f6787" text-anchor="middle">压缩机</text>
    <circle cx="735" cy="62" r="13" fill="#1a1030" stroke="#3a2d5c" stroke-width="1"/>
    <text x="735" y="91" font-size="10" fill="#6f6787" text-anchor="middle">保温层</text>
    <circle cx="990" cy="240" r="13" fill="#1a1030" stroke="#3a2d5c" stroke-width="1"/>
    <text x="990" y="269" font-size="10" fill="#6f6787" text-anchor="middle">三洋系</text>
    <circle cx="250" cy="125" r="13" fill="#1a1030" stroke="#3a2d5c" stroke-width="1"/>
    <text x="250" y="154" font-size="10" fill="#6f6787" text-anchor="middle">端子排</text>
    <circle cx="330" cy="430" r="13" fill="#1a1030" stroke="#3a2d5c" stroke-width="1"/>
    <text x="330" y="459" font-size="10" fill="#6f6787" text-anchor="middle">回风道</text>
    <circle cx="700" cy="440" r="13" fill="#1a1030" stroke="#3a2d5c" stroke-width="1"/>
    <text x="700" y="469" font-size="10" fill="#6f6787" text-anchor="middle">蒸发器</text>
  </g>

  <!-- 实体关联边（绕外圈，压暗，垫底） -->
  <g id="edge-haier" stroke="#6b4fb0" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 129 200 C 240 210 360 215 556 232"/>
    <path d="M 129 200 C 350 10 780 10 1000 100"/>
    <path d="M 129 200 C 350 470 780 470 980 390"/>
    <text x="360" y="224" font-size="10" fill="#9b93ab" text-anchor="middle">品牌关联</text>
  </g>
  <g id="edge-model" stroke="#6b4fb0" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 644 235 C 780 140 860 120 986 105"/>
    <path d="M 1010 129 C 1030 220 1025 310 995 375"/>
    <text x="820" y="150" font-size="10" fill="#9b93ab" text-anchor="middle">同系列</text>
    <text x="1030" y="262" font-size="10" fill="#9b93ab" text-anchor="middle">姊妹款</text>
  </g>
  <g id="node-haier">
    <circle cx="105" cy="200" r="24" fill="#16122a" stroke="#6b4fb0" stroke-width="2"/>
    <text x="105" y="205" font-size="13" font-weight="700" fill="#f3f0fa" text-anchor="middle">海尔厂</text>
    <text x="105" y="224" font-size="10" fill="#9b93ab" text-anchor="middle">品牌 · 实体</text>
  </g>
  <g id="node-model2">
    <circle cx="1010" cy="105" r="24" fill="#16122a" stroke="#6b4fb0" stroke-width="2"/>
    <text x="1010" y="110" font-size="12.5" font-weight="700" fill="#f3f0fa" text-anchor="middle">DW-1886C</text>
    <text x="1010" y="130" font-size="10" fill="#9b93ab" text-anchor="middle">另一型号</text>
  </g>
  <g id="node-ghost2">
    <circle cx="995" cy="395" r="20" fill="#16122a" stroke="#6b4fb0" stroke-width="1.5"/>
    <text x="995" y="400" font-size="11" font-weight="700" fill="#f3f0fa" text-anchor="middle">DW-1020G</text>
    <text x="995" y="418" font-size="10" fill="#9b93ab" text-anchor="middle">姊妹款</text>
  </g>

  <!-- 中心光环 + 中心节点 -->
  <circle id="halo-center" cx="600" cy="235" r="82" fill="url(#halo)"/>
  <g id="node-center">
    <circle cx="600" cy="235" r="44" fill="#1a1030" stroke="#a974ff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="600" y="240" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">DW-1224DC</text>
    <text x="600" y="262" font-size="11" fill="#cdc3f2" text-anchor="middle">超低温冰箱 · 主角</text>
  </g>

  <!-- 属性节点（12 个放射辐条，最上层） -->
  <g id="p-cool">
    <path d="M 600 191 L 600 85" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="600" cy="70" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="600" y="52" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">制冷剂</text>
    <text x="600" y="96" font-size="11.5" fill="#9b93ab" text-anchor="middle">R404a</text>
  </g>
  <g id="p-size">
    <path d="M 633 206 L 748 98" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="760" cy="92" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="760" y="74" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">尺寸</text>
    <text x="760" y="118" font-size="11.5" fill="#9b93ab" text-anchor="middle">908×765×2025</text>
  </g>
  <g id="p-vol">
    <path d="M 642 222 L 866 158" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="877" cy="152" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="877" y="134" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">容积</text>
    <text x="877" y="178" font-size="11.5" fill="#9b93ab" text-anchor="middle">636L</text>
  </g>
  <g id="p-temp">
    <path d="M 644 235 L 907 235" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="920" cy="235" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="920" y="217" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">温度</text>
    <text x="920" y="261" font-size="11.5" fill="#9b93ab" text-anchor="middle">-60~-86℃</text>
  </g>
  <g id="p-door">
    <path d="M 642 248 L 866 312" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="877" cy="318" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="877" y="300" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">门数</text>
    <text x="877" y="344" font-size="11.5" fill="#9b93ab" text-anchor="middle">2</text>
  </g>
  <g id="p-power">
    <path d="M 633 264 L 748 372" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="760" cy="378" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="760" y="360" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">功率</text>
    <text x="760" y="404" font-size="11.5" fill="#9b93ab" text-anchor="middle">1120W</text>
  </g>
  <g id="p-weight">
    <path d="M 600 279 L 600 387" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="600" cy="400" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="600" y="382" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">净重</text>
    <text x="600" y="426" font-size="11.5" fill="#9b93ab" text-anchor="middle">约135kg</text>
  </g>
  <g id="p-noise">
    <path d="M 567 264 L 452 372" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="440" cy="378" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="440" y="360" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">噪音</text>
    <text x="440" y="404" font-size="11.5" fill="#9b93ab" text-anchor="middle">55dB</text>
  </g>
  <g id="p-eff">
    <path d="M 558 248 L 334 312" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="323" cy="318" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="323" y="300" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">能效</text>
    <text x="323" y="344" font-size="11.5" fill="#9b93ab" text-anchor="middle">1级</text>
  </g>
  <g id="p-cert">
    <path d="M 556 235 L 293 235" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="280" cy="235" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="280" y="217" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">认证</text>
    <text x="280" y="261" font-size="11.5" fill="#9b93ab" text-anchor="middle">医疗级</text>
  </g>
  <g id="p-comp">
    <path d="M 558 222 L 334 158" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="323" cy="152" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="323" y="134" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">压缩机</text>
    <text x="323" y="178" font-size="11.5" fill="#9b93ab" text-anchor="middle">品牌A</text>
  </g>
  <g id="p-series">
    <path d="M 567 206 L 452 98" stroke="#463a66" stroke-width="1.5"/>
    <circle cx="440" cy="92" r="13" fill="#16122a" stroke="#6f6787" stroke-width="1.5"/>
    <text x="440" y="74" font-size="13" font-weight="600" fill="#f3f0fa" text-anchor="middle">系列</text>
    <text x="440" y="118" font-size="11.5" fill="#9b93ab" text-anchor="middle">医用冷柜</text>
  </g>

  <!-- 复杂度警告 -->
  <g id="label-complex">
    <text x="40" y="432" font-size="15" font-weight="600" fill="#ffb454">⚠ 关系越加越多 · 图越来越复杂</text>
  </g>
</g>

<!-- ============ ② 因果链区 ============ -->
<g id="zone-causal" transform="translate(40 540)">
  <text x="0" y="14" font-size="15" font-weight="600" fill="#a974ff">② 复杂因果被压成片面边</text>

  <!-- 难题框 -->
  <g id="causal-original">
    <rect x="0" y="30" width="1120" height="88" rx="12" fill="#12101e" stroke="#4f7bdd" stroke-width="1.5"/>
    <rect x="0" y="30" width="64" height="24" rx="6" fill="#4f7bdd"/>
    <text x="32" y="46" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">难题</text>
    <text x="80" y="52" font-size="17" fill="#cdc3f2">单循环制冷系统：整套冰箱仅配置 1 个蒸发器，</text>
    <text x="80" y="78" font-size="17" fill="#cdc3f2">依赖风机和风道将冷量被动输送至舱室，通过风门开关控制送风量。</text>
  </g>

  <!-- 完整因果链 -->
  <text x="0" y="146" font-size="16" font-weight="600" fill="#a974ff">难题里的完整因果链</text>
  <g id="causal-chain">
    <rect x="0" y="156" width="196" height="44" rx="9" fill="#1a1030" stroke="#a974ff" stroke-width="1.5"/>
    <text x="98" y="183" font-size="17" font-weight="600" fill="#f3f0fa" text-anchor="middle">单蒸发器</text>
    <path d="M 196 178 L 221 178" stroke="#a974ff" stroke-width="2"/>
    <path d="M 221 178 L 213 173 M 221 178 L 213 183" stroke="#a974ff" stroke-width="2" fill="none"/>
    <rect x="226" y="156" width="196" height="44" rx="9" fill="#1a1030" stroke="#a974ff" stroke-width="1.5"/>
    <text x="324" y="183" font-size="17" font-weight="600" fill="#f3f0fa" text-anchor="middle">冷量统一产出</text>
    <path d="M 422 178 L 447 178" stroke="#a974ff" stroke-width="2"/>
    <path d="M 447 178 L 439 173 M 447 178 L 439 183" stroke="#a974ff" stroke-width="2" fill="none"/>
    <rect x="452" y="156" width="196" height="44" rx="9" fill="#1a1030" stroke="#a974ff" stroke-width="1.5"/>
    <text x="550" y="183" font-size="17" font-weight="600" fill="#f3f0fa" text-anchor="middle">单风道被动输送</text>
    <path d="M 648 178 L 673 178" stroke="#a974ff" stroke-width="2"/>
    <path d="M 673 178 L 665 173 M 673 178 L 665 183" stroke="#a974ff" stroke-width="2" fill="none"/>
    <rect x="678" y="156" width="196" height="44" rx="9" fill="#1a1030" stroke="#a974ff" stroke-width="1.5"/>
    <text x="776" y="183" font-size="17" font-weight="600" fill="#f3f0fa" text-anchor="middle">风门开关分配</text>
    <path d="M 874 178 L 899 178" stroke="#a974ff" stroke-width="2"/>
    <path d="M 899 178 L 891 173 M 899 178 L 891 183" stroke="#a974ff" stroke-width="2" fill="none"/>
    <rect x="904" y="156" width="196" height="44" rx="9" fill="#1a1030" stroke="#a974ff" stroke-width="1.5"/>
    <text x="1002" y="183" font-size="17" font-weight="600" fill="#f3f0fa" text-anchor="middle">各舱室冷量不均</text>
  </g>

  <!-- 建出的片面边 -->
  <g id="causal-built">
    <text x="0" y="232" font-size="18" font-weight="600" fill="#ff5c5c">⚠ 边建出来了，但只存下 2 条「关系」，细节全丢</text>
    <rect x="0" y="246" width="540" height="46" rx="10" fill="#1a0d10" stroke="#ff5c5c" stroke-width="1.5"/>
    <text x="16" y="275" font-size="15" fill="#ffb0b0">单循环制冷系统 —送风模式→ 单风道集中送风</text>
    <rect x="580" y="246" width="540" height="46" rx="10" fill="#1a0d10" stroke="#ff5c5c" stroke-width="1.5"/>
    <text x="596" y="275" font-size="15" fill="#ffb0b0">单循环制冷系统 —制冷剂循环方式→ 单压机带动整个系统</text>
    <text x="0" y="318" font-size="16" fill="#ff9f9f">丢掉了：单蒸发器 · 被动输送 · 风门开关</text>
  </g>
</g>

<!-- ============ ③ 检索失败区 ============ -->
<g id="zone-outcome" transform="translate(40 900)">
  <text x="0" y="14" font-size="15" font-weight="600" fill="#ff8f8f">③ 检索只点亮属性边 · 无法溯源</text>
  <g id="outcome-box">
    <rect x="0" y="30" width="1120" height="46" rx="12" fill="#2a0f12" stroke="#ff5c5c" stroke-width="1.5"/>
    <text x="24" y="58" font-size="17" font-weight="700" fill="#ff8f8f">✗ 检索回不了原文 · 全是幻觉 —— 只能点亮几根属性边，答案靠 LLM 脑补</text>
  </g>
</g>

</svg>