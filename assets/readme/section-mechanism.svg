<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="160" viewBox="0 0 1200 160"
     role="img" aria-labelledby="title desc">
  <title id="title">工作原理</title>
  <desc id="desc">XingGraph 的建图管线与 WIKI 渐进式检索步骤预览 banner。</desc>

  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a974ff"/>
      <stop offset="1" stop-color="#4f7bdd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="160" rx="14" fill="#0a0a0d"/>

  <g transform="translate(48 36)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" font-weight="600" fill="#a974ff" letter-spacing="3">
      SECTION · 03
    </text>
    <text x="0" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="36" font-weight="800" fill="#f3f0fa">
      工作原理
    </text>
    <text x="0" y="76" font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="16" font-weight="500" fill="#cdc3f2">
      PDF → 结构化切块 → 入图 → WIKI 多主体检索 → 标题归因
    </text>
    <rect x="0" y="92" width="56" height="3" rx="1.5" fill="url(#hl)"/>
  </g>

  <!-- RIGHT: 5-step strip -->
  <g transform="translate(880 38)" font-family="ui-monospace, monospace" font-size="12">
    <g fill="#9b93ab" font-weight="600">
      <text x="0"   y="14">Step0</text>
      <text x="64"  y="14">Step1</text>
      <text x="128" y="14">Step2</text>
      <text x="192" y="14">Step3</text>
      <text x="256" y="14">Step4</text>
    </g>
    <g stroke="#a974ff" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="0"   y1="32" x2="316" y2="32"/>
    </g>
    <g>
      <circle cx="2"   cy="32" r="6" fill="#a974ff"/>
      <circle cx="66"  cy="32" r="6" fill="#a974ff"/>
      <circle cx="130" cy="32" r="6" fill="#a974ff"/>
      <circle cx="194" cy="32" r="6" fill="#a974ff"/>
      <circle cx="258" cy="32" r="6" fill="#4f7bdd"/>
    </g>
    <g fill="#cdc3f2" font-size="11">
      <text x="0"   y="58">拆主体</text>
      <text x="64"  y="58">锚定</text>
      <text x="128" y="58">遍历</text>
      <text x="192" y="58">汇总</text>
      <text x="256" y="58">归因</text>
    </g>
  </g>
</svg>