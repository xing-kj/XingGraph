<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="title desc">
  <title id="title">xing-kj · Building knowledge-graph RAG</title>
  <desc id="desc">GitHub 个人主页 hero：用户名 xing-kj、定位语、三个 stack 标签；右侧六层节点 motif 与 XingGraph 同源。</desc>

  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a974ff"/>
      <stop offset="1" stop-color="#4f7bdd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#0a0a0d"/>

  <!-- subtle grid -->
  <g stroke="#16122a" stroke-width="1" opacity="0.7">
    <line x1="0" y1="65"  x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- LEFT: name + tagline -->
  <g transform="translate(64 64)">
    <text x="0" y="0" font-family="ui-monospace, monospace"
          font-size="13" font-weight="600" fill="#a974ff" letter-spacing="3">
      xing-kj · GITHUB PROFILE
    </text>

    <text x="0" y="72"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="68" font-weight="800" fill="#f3f0fa" letter-spacing="-1.5">
      Building knowledge-graph
    </text>
    <text x="0" y="116"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="38" font-weight="700" fill="#cdc3f2" letter-spacing="-0.5">
      RAG &amp; agents.
    </text>

    <g font-family="ui-monospace, monospace" font-size="14" fill="#9b93ab">
      <text x="2" y="158">Python · MCP · FastAPI · Neo4j · RDF/OWL</text>
    </g>
    <rect x="0" y="172" width="56" height="3" rx="1.5" fill="url(#hl)"/>
  </g>

  <!-- RIGHT: 6-node graph constellation -->
  <g transform="translate(880 56)">
    <g stroke="#16122a" stroke-width="1" fill="none">
      <line x1="40"  y1="20"  x2="200" y2="20"/>
      <line x1="40"  y1="80"  x2="200" y2="80"/>
      <line x1="40"  y1="140" x2="200" y2="140"/>
      <line x1="40"  y1="20"  x2="40"  y2="140"/>
      <line x1="200" y1="20"  x2="200" y2="140"/>
    </g>
    <g>
      <circle cx="40"  cy="20"  r="14" fill="#A550FF"/>
      <circle cx="120" cy="20"  r="12" fill="#0DFF00"/>
      <circle cx="200" cy="20"  r="10" fill="#FF5CA8"/>
      <circle cx="40"  cy="80"  r="12" fill="#6510F4"/>
      <circle cx="120" cy="80"  r="14" fill="#D5C2FF"/>
      <circle cx="200" cy="80"  r="10" fill="#FFB454"/>
    </g>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#9b93ab">
      <text x="40"  y="-2">Document</text>
      <text x="120" y="-2">Chunk</text>
      <text x="200" y="-2">Wiki</text>
      <text x="40"  y="118">Entity</text>
      <text x="120" y="118">Type</text>
      <text x="200" y="118">Summary</text>
    </g>
  </g>
</svg>