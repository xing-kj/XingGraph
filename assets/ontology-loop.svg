<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title>本体可扩展环</title>
<desc>Business terms flow into the RDF/OWL ontology dictionary, powering the retrieval system, with feedback flowing back to evolve it.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0a1a"/>
<stop offset="0.5" stop-color="#140f2e"/>
<stop offset="1" stop-color="#0a0a1a"/>
</linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect x="0" y="0" width="1000" height="580" fill="url(#bg)"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#f3f0fa">本体可扩展环 · 业务术语即扩展点</text>
<rect x="42" y="52" width="46" height="3" rx="1.5" fill="#a974ff"/>

<g>
<circle cx="160" cy="300" r="46" fill="#16122a" stroke="#a974ff" stroke-width="1.5"/>
<text x="160" y="292" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">业务术语</text>
<text x="160" y="310" font-size="10" fill="#cdc3f2" text-anchor="middle">新增实体/关系</text>
</g>

<g>
<circle cx="500" cy="130" r="46" fill="#16122a" stroke="#4f7bdd" stroke-width="1.5"/>
<text x="500" y="122" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">RDF/OWL</text>
<text x="500" y="140" font-size="10" fill="#cdc3f2" text-anchor="middle">本体词典</text>
</g>

<g>
<circle cx="840" cy="300" r="46" fill="#16122a" stroke="#a974ff" stroke-width="1.5"/>
<text x="840" y="292" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">检索系统</text>
<text x="840" y="310" font-size="10" fill="#cdc3f2" text-anchor="middle">锚定/遍历/回答</text>
</g>

<g stroke="#463a66" stroke-width="2.5" fill="none">
<path id="o1" d="M 200 268 L 460 148"/>
<path id="o2" d="M 540 148 L 800 268"/>
<path id="o3" d="M 820 344 L 180 344"/>
</g>
<g>
<circle r="6" fill="#a974ff" filter="url(#glow)"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></circle>
<circle r="6" fill="#4f7bdd" filter="url(#glow)"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle>
<circle r="6" fill="#6b4fb0" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.6s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle>
</g>

<g font-size="10.5" fill="#9b93ab" text-anchor="middle">
<text x="330" y="196">新增术语入库</text>
<text x="670" y="196">检索消费本体</text>
<text x="500" y="374">反馈回流 · 不断进化</text>
</g>

<g>
<rect x="300" y="420" width="400" height="86" rx="12" fill="#16122a" stroke="#463a66" stroke-width="1.5"/>
<text x="330" y="452" font-size="12" font-weight="700" fill="#cdc3f2">怎么扩展？</text>
<text x="330" y="474" font-size="11.5" fill="#9b93ab">RDFLibOntologyResolver + rdf_ingest 加术语，</text>
<text x="330" y="494" font-size="11.5" fill="#9b93ab">OntologyHierarchyCache + matching_strategies 生效，</text>
</g>

<text x="40" y="540" font-size="13" fill="#9b93ab">业务人员只需维护本体词典 —— 不碰代码，检索语义即增强；feedback_influence 让反馈持续影响图权重。</text>
</svg>