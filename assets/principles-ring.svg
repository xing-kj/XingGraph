<animate attributeName="r" values="10;22;22" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.4;1" dur="3.2s" repeatCount="indefinite"/>
