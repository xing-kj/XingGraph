<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<title>xing-kj — Seven Design Principles</title>
<desc>Seven design principles of XingGraph radiating from the center: observable, traceable, controllable, extensible, evolvable, token-efficient, low-hallucination.</desc>
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#6b4fb0"/>
<stop offset="1" stop-color="#4f7bdd"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="840" height="660" fill="#0a0a0d"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#f3f0fa">Seven Design Principles · 七项设计原则</text>
<rect x="42" y="52" width="46" height="3" rx="1.5" fill="#a974ff"/>

<g stroke="#2a2340" stroke-width="1">
<circle cx="420" cy="340" r="200" fill="none"/>
<circle cx="420" cy="340" r="120" fill="none" opacity="0.6"/>
<circle cx="420" cy="340" r="52" fill="#16122a" stroke="url(#ring)" stroke-width="1"/>
</g>

<g stroke="#463a66" stroke-width="1.4">
<line x1="420" y1="340" x2="420" y2="140"/>
<line x1="420" y1="340" x2="576" y2="215"/>
