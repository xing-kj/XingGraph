<text x="420" y="340" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">XingGraph</text>
<text x="420" y="357" font-size="10" fill="#cdbcf2" text-anchor="middle">Graph RAG</text>
</g>
</svg>