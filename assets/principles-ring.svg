<circle cx="300" cy="262" r="10" fill="none" stroke="#b98cff" stroke-width="1.5" opacity="0">
<animate attributeName="r" values="10;22;22" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite" begin="2.7s"/>
<animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.4;1" dur="3.2s" repeatCount="indefinite" begin="2.7s"/>
