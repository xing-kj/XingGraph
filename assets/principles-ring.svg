<g font-size="13.5" font-weight="700" fill="#f3f0fa" text-anchor="middle">
<text x="420" y="192">可观测</text>
<text x="549" y="246">可回溯</text>
<text x="583" y="356">可控制</text>
<text x="489" y="510">可扩展</text>
<text x="345" y="510">可进化</text>
<text x="251" y="356">省 token</text>
<text x="291" y="246">少幻觉</text>
</g>
<g font-size="10.5" fill="#9b93ab" text-anchor="middle">
<text x="420" y="178">trace + OTEL</text>
<text x="555" y="232">标题归因 + refs</text>
<text x="589" y="342">路由 / scope / 开关</text>
<text x="489" y="494">RDF 本体即扩展点</text>
<text x="345" y="494">prompt/chunker + 反馈</text>
<text x="245" y="342">白名单硬过滤</text>
<text x="291" y="232">原文 chunk 绑定</text>
</g>

<g>
<circle cx="420" cy="340" r="42" fill="#6b4fb0" filter="url(#softglow)"/>
<circle cx="420" cy="340" r="42" fill="none" stroke="#d9bcff" stroke-width="1.5" opacity="0">
<animate attributeName="r" values="42;64;64" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.4;1" dur="3.2s" repeatCount="indefinite"/>
