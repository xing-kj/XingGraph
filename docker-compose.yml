services:
  xinggraph:
    container_name: xinggraph
    restart: always
    networks:
      - xinggraph-network
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./xinggraph:/app/xinggraph
      - .env:/app/.env
      # Uncomment to allow ingestion of local files from host:
      # - /path/to/your/data:/data
    environment:
      - DEBUG=false # Change to true if debugging
      - ENV=local
      - LOG_LEVEL=INFO
      # CAUTION: Default '*' allows all origins. Override with specific domains in production.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    extra_hosts:
      # Allows the container to reach your local machine using "host.docker.internal" instead of "localhost"
      - "host.docker.internal:host-gateway"
    ports:
      - 8000:8000
      - 5678:5678 # Debugger port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8GB

  # XingGraph MCP Server - Model Context Protocol server for IDE integration
  xinggraph-mcp:
    container_name: xinggraph-mcp
    profiles:
      - mcp
    networks:
      - xinggraph-network
    build:
      context: .
      dockerfile: xinggraph-mcp/Dockerfile
    command: --no-migration
    volumes:
      - .env:/app/.env
      - ./xinggraph:/app/xinggraph
      # Uncomment to allow ingestion of local files from host:
      # - /path/to/your/data:/data
    environment:
      - DEBUG=false # Change to true if debugging
      - ENV=local
      - LOG_LEVEL=INFO
      - TRANSPORT_MODE=sse
      # Database configuration - should match the main xinggraph service
      - DB_PROVIDER=${DB_PROVIDER:-sqlite}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-xinggraph_db}
      - DB_USERNAME=${DB_USERNAME:-xinggraph}
      - DB_PASSWORD=${DB_PASSWORD:-xinggraph}
      # MCP specific configuration
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host ports differ from the main `xinggraph` service so both can run together
      # (the MCP server still listens on 8000 inside the container).
      - "8001:8000" # MCP port
      - "5679:5678" # MCP debugger port
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4GB

  # NOTE: Frontend is a work in progress and supports minimum amount of features required to be functional.
  # If you want to use XingGraph with a UI environment you can integrate the XingGraph MCP Server into Cursor / Claude Desktop / Visual Studio Code (through Cline/Roo)
  frontend:
    container_name: frontend
    restart: always
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_IS_CLOUD_ENVIRONMENT=false
    profiles:
        - ui
    build:
      context: ./xinggraph-frontend
      dockerfile: Dockerfile
    volumes:
      - ./xinggraph-frontend/src:/app/src
      - ./xinggraph-frontend/public:/app/public
    ports:
      - 3000:3000
      # - 9229:9229 # Debugging
    networks:
      - xinggraph-network

  neo4j:
    image: neo4j:5.26  # Pinned to 5.x; compatible with neo4j Python driver >=5.28,<6
    container_name: neo4j
    restart: always
    profiles:
      - neo4j
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/pleaseletmein
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    networks:
      - xinggraph-network

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: always
    profiles:
      - postgres
    environment:
      POSTGRES_USER: xinggraph
      POSTGRES_PASSWORD: xinggraph
      POSTGRES_DB: xinggraph_db
      # - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - xinggraph-network

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles:
      - redis
    ports:
      - "6379:6379"
    networks:
      - xinggraph-network
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]


  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    restart: always
    ports:
      - "5540:5540"
    networks:
      - xinggraph-network


networks:
  xinggraph-network:
    name: xinggraph-network

volumes:
  postgres_data:
  redis_data:
