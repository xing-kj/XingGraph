name: test | mcp

on:
  workflow_call:
    inputs:
      xinggraph_version:
        required: false
        type: string
        default: "local" # local - Installing XingGraph from local source
        description: "Pypi-compatible version of xinggraph to use. For example, 0.5.2.dev0. `local` (default) - Installing XingGraph from local source"

env:
  XINGGRAPH_SKIP_CONNECTION_TEST: 'true'

jobs:
  test-mcp:
    name: Run MCP Test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install UV
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        shell: bash
        working-directory: xinggraph-mcp
        run: uv sync

      - name: Install XingGraph
        uses: ./.github/actions/install_xinggraph
        with:
          python-version: ${{ inputs.python-version }}
          xinggraph_version: ${{ inputs.xinggraph_version }}

      - name: Run MCP unit tests
        working-directory: xinggraph-mcp
        run: uv run --no-sync pytest tests/

      - name: Run MCP test
        env:
          ENV: 'dev'
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_ARGS: ${{ secrets.LLM_ARGS }}
          LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
          EMBEDDING_DIMENSIONS: 300
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
        working-directory: xinggraph-mcp
        run: |
          echo "XingGraph Version:"
          uv pip show xinggraph | grep Version
          uv run --no-sync python ./src/test_client.py
