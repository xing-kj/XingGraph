name: build test | Docker image

on:
  workflow_call:

env:
  AWS_ACCOUNT_ID_DEV: "463722570299"
  XINGGRAPH_SKIP_CONNECTION_TEST: 'true'

jobs:

  build_docker:
    name: Build XingGraph Backend Docker App Image
    runs-on: ubuntu-22.04
    steps:
      - name: Check out XingGraph code
        uses: actions/checkout@v6

      - name: Build XingGraph Docker image
        id: xinggraph-docker-tag
        run: |
          export SHA_SHORT="$(git rev-parse --short HEAD)"
          export CUR_DATE="$(date +%Y%m%d%H%M%S)"
          export VERSION="dev-$CUR_DATE-$SHA_SHORT"
          image_name="xinggraph" docker_login="false" version="$VERSION" account="${{ env.AWS_ACCOUNT_ID_DEV }}" app_dir="." publish="false" ./bin/dockerize
          export DOCKER_TAG=$(cat /tmp/.DOCKER_IMAGE_VERSION)
          echo "Successfully built xinggraph Docker image. Tag is: $DOCKER_TAG"
