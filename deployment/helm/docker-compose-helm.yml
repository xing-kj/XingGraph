services:
  xinggraph:
    image : xinggraph-backend:latest
    container_name: xinggraph-backend
    networks:
      - xinggraph-network
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/xinggraph-frontend/ # Ignore frontend code
    environment:
      - ENV=local
      - PYTHONPATH=.
    ports:
      - 8000:8000
      # - 5678:5678 # Debugging
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8GB

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_USER: xinggraph
      POSTGRES_PASSWORD: xinggraph
      POSTGRES_DB: xinggraph_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - xinggraph-network

networks:
  xinggraph-network:
    name: xinggraph-network

volumes:
  postgres_data:
